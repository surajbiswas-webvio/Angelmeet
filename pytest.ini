[pytest]
# The tests/ directory is where all test modules live.
testpaths = tests
# Add any passed/failed/skipped summary flags; -ra reports a summary of all outcomes.
addopts = -ra
# Custom markers used across the suite to group and filter tests.
markers =
    smoke: smoke coverage
    unauthenticated: run with an empty browser storage state
    admin: run against the admin application
# Default base URL used when tests navigate the user application.
base_url = https://app.angelmeet.ai
