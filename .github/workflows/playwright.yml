name: AngelMeet E2E
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://app.angelmeet.ai
      E2E_EMAIL: avi100147@gmail.com
      E2E_PASSWORD: $uper@dmin4MYadmin
      ADMIN_URL: https://admin.angelmeet.ai
      ADMIN_EMAIL: avi100147@gmail.com
      ADMIN_PASSWORD: $uper@dmin4MYadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: allure-results, path: allure-results, if-no-files-found: ignore }